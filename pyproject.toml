[project]
name = "llm-data-aug"
version = "0.1.0"
description = "Data augmentation for sentiment analysis tasks."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dagster>=1.10.21",
    "dagster-dg-cli>=1.10.21",
    "dagster-webserver>=1.10.21",
    "dvc>=3.60.1",
    "google-genai>=1.20.0",
    "instructor>=1.8.3",
    "loguru>=0.7.3",
    "pandas>=2.3.0",
    "python-dotenv>=1.1.0",
    "ruff>=0.11.13",
    "tabulate>=0.9.0",
    "transformers>=4.52.4",
    "vncorenlp>=1.0.3",
]

[dependency-groups]
dev = [
    "ruff>=0.11.13",
]
